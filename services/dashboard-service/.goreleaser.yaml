version: 1

before:
  hooks:
    - go mod tidy

builds:
  - id: demo-consul-101
    main: ./services/dashboard-service
    binary: demo-consul-101
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: hsenghom
    name: dashboard-service

changelog:
  sort: asc

